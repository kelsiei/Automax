name: Postgres Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    env:
      DOTNET_VERSION: '8.0.x'
      AUTOMAX_ENABLE_POSTGRES_INTEGRATION_TESTS: 'true'
      AUTOMAX_POSTGRES_CONNECTION_STRING: 'Host=localhost;Port=5432;Database=automax;Username=automax;Password=automax'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: automax
          POSTGRES_PASSWORD: automax
          POSTGRES_DB: automax
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U automax -d automax"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U automax -d automax; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres..."
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Apply Postgres schema
        run: |
          psql "postgresql://automax:automax@localhost:5432/automax" -f docs/db/postgres-schema.sql

      - name: Restore
        run: dotnet restore Automax.sln

      - name: Build
        run: dotnet build Automax.sln --configuration Release --no-restore

      - name: Test (with Postgres integration)
        run: dotnet test Automax.sln --configuration Release --no-build
